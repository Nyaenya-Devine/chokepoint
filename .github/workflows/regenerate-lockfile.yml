name: Regenerate dependency lockfile

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize dependency lockfile"
            git push
          fi
      - name: Remove workflow
        run: |
          set -eu
          rm .github/workflows/regenerate-lockfile.yml
          git add .github/workflows/regenerate-lockfile.yml
          git commit -m "chore: remove temporary lockfile workflow"
          git push
