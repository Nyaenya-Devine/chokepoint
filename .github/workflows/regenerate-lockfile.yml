name: Regenerate dependency lockfile

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes needed"
          else
            git commit -m "chore: regenerate lockfile for Next.js 16.3.6"
            git push
          fi
      - name: Remove temporary workflow
        run: |
          set -eu
          rm -f .github/workflows/regenerate-lockfile.yml
          git add .github/workflows/regenerate-lockfile.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary lockfile workflow"
            git push
          fi
