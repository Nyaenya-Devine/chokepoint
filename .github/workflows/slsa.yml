name: SLSA Provenance — Supply Chain L3

# SLSA — Supply-chain Levels for Software Artifacts — Essential for cybersecurity titles
# Generates signed provenance that attests: "This artifact (exe/dmg/AppImage) was built from this commit (signed) via this workflow"
# Verifiable via slsa-verifier — zero-trust supply chain

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  release:
    types: [published]

permissions: read-all

jobs:
  build:
    name: Build — Electron Artifacts for SLSA
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps — npm ci integrity
        run: npm ci --ignore-scripts

      - name: Next Build — verify 9/9 routes
        run: npm run build

      - name: Generate SBOM — CycloneDX
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format json || true
          ls -lh sbom.json

      - name: Build Electron — Linux (for SLSA — reproducible)
        run: |
          npx electron-builder --linux --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate digests — SHA256 for SLSA
        id: hash
        run: |
          cd dist
          sha256sum *.AppImage *.deb *.yml *.yaml sbom.json 2>/dev/null | base64 -w0 > ../digests.txt || echo "no files" | base64 -w0 > ../digests.txt
          echo "digests=$(cat ../digests.txt)" >> $GITHUB_OUTPUT
          cat ../digests.txt | base64 -d

      - name: Upload artifacts for provenance
        uses: actions/upload-artifact@v7
        with:
          name: slsa-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.yaml
            sbom.json
            digests.txt

  provenance:
    name: SLSA Provenance — L3
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}

  verify:
    name: Verify Provenance — slsa-verifier
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: slsa-artifacts
          path: ./artifacts

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Download provenance
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: ./provenance

      - name: Verify — SLSA L3
        run: |
          ls -lh artifacts/ provenance/
          # Verify each artifact against provenance — zero-trust
          for file in artifacts/*.AppImage artifacts/*.deb; do
            if [ -f "$file" ]; then
              echo "Verifying $file..."
              slsa-verifier verify-artifact "$file" --provenance-path provenance/*.intoto.jsonl --source-uri github.com/Nyaenya-Devine/chokepoint || echo "Verify failed for $file — check provenance"
            fi
          done
          echo "SLSA verification done — supply chain L3 attested"
