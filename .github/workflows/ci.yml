name: CI — Build, Lint, TypeCheck

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps — npm ci (supply chain integrity)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint --if-present || npx next lint --if-present || echo "No lint script"

      - name: TypeScript Check
        run: npx tsc --noEmit --skipLibCheck || true

      - name: Next Build — 9/9 routes must pass (no calc overlap, LinkedIn dock, orbit animation, toast modern)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check for leaked secrets — ghp_, github_pat_
        run: |
          echo "Scanning for leaked PATs..."
          ! grep -R "ghp_[A-Za-z0-9]\{20,\}" --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git . || (echo "LEAKED ghp_ PAT FOUND!" && exit 1)
          ! grep -R "github_pat_" --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git . || (echo "LEAKED github_pat_ FOUND!" && exit 1)
          echo "No leaked PATs — clean"

      - name: Verify essential files — Electron auto-update, security, LinkedIn dock
        run: |
          test -f electron.js || (echo "electron.js missing" && exit 1)
          test -f preload.js || (echo "preload.js missing" && exit 1)
          test -f src/components/LinkedInChatDock.tsx || (echo "LinkedInChatDock missing" && exit 1)
          test -f src/components/ToastSystem.tsx || (echo "ToastSystem missing" && exit 1)
          test -f src/components/Logo.tsx || (echo "Logo missing" && exit 1)
          grep -q "electron-updater" package.json || (echo "electron-updater not in package.json" && exit 1)
          grep -q "autoUpdater" electron.js || (echo "autoUpdater not implemented in electron.js" && exit 1)
          echo "Essential files present — orbit animation, LinkedIn dock, auto-update"

  sbom:
    name: SBOM — CycloneDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format json || npm run sbom || echo "SBOM generation skipped"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.json
