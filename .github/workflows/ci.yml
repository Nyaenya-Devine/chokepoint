name: CI — Build, Test, Lint, TypeCheck

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps — npm ci
        run: npm ci --ignore-scripts
      - name: Dependency audit — high severity gate
        run: npm audit --audit-level=high
      - name: Test security properties
        run: npm test
      - name: Lint
        run: npm run lint --if-present || npx eslint .
      - name: TypeScript Check
        run: npx tsc --noEmit --skipLibCheck
      - name: Next Build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Check for leaked secrets
        run: |
          set -eu
          ! grep -R -E "ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}" --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git .
      - name: Verify essential files and Electron hardening
        run: |
          set -eu
          test -f electron.js
          test -f preload.js
          grep -q "electron-updater" package.json
          grep -q "autoUpdater" electron.js
          grep -q "contextIsolation: true" electron.js
          grep -q "nodeIntegration: false" electron.js
          grep -q "sandbox: true" electron.js
          grep -q "webSecurity: true" electron.js

  sbom:
    name: SBOM — CycloneDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
