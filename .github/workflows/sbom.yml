name: SBOM — Supply Chain Transparency

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate SBOM — JSON + XML
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format json --spec-version 1.6
          npx @cyclonedx/cyclonedx-npm --output-file sbom.xml --output-format xml --spec-version 1.6
          ls -lh sbom.*
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: |
            sbom.json
            sbom.xml
          if-no-files-found: error
