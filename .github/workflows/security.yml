name: Security — CodeQL, Dependency Review, Secret Scan, Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL — SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"

  dependency-review:
    name: Dependency Review — Supply Chain
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD

  secret-scan:
    name: Secret Scan — TruffleHog + Grep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
      - name: Grep for PAT patterns — fail on leak
        run: |
          set -eu
          ! grep -R --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.git -E "ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|vcp_[A-Za-z0-9]{20,}" .

  npm-audit:
    name: npm Audit — CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Verify supported Electron baseline
        run: |
          node -e "const v=require('./package.json').devDependencies.electron; const major=parseInt(v.match(/\d+/)[0]); if(major<42){console.error('Electron <42 is unsupported/EOL'); process.exit(1)} console.log('Electron security baseline OK:', v)"

  headers-check:
    name: Security Headers — CSP, HSTS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          set -eu
          grep -q "X-Frame-Options" next.config.mjs
          grep -q "Content-Security-Policy" next.config.mjs
          grep -q "Strict-Transport-Security" next.config.mjs
          grep -q "Permissions-Policy" next.config.mjs

  electron-hardening:
    name: Electron Hardening — Zero-Trust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          set -eu
          grep -q "contextIsolation: true" electron.js
          grep -q "nodeIntegration: false" electron.js
          grep -q "sandbox: true" electron.js
          grep -q "webSecurity: true" electron.js
          grep -q "setPermissionRequestHandler" electron.js
          grep -q "autoUpdater" electron.js
          grep -q "requestSingleInstanceLock" electron.js
